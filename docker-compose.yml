services:
  postgres:
    image: postgres:17
    container_name: audience-checkout-postgres
    environment:
      POSTGRES_DB: checkout_db
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    ports:
      - "5432:5432"
    volumes:
      - audience_checkout_postgres_data:/var/lib/postgresql/data

volumes:
  audience_checkout_postgres_data: